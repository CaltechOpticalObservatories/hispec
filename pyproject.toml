[tool.setuptools.packages.find]
where = ["src"]
include = ["hispec", "hispec.*"]

[tool.setuptools.package-data]
"hispec.cli" = ["instrument.toml"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hispec"
version = "0.1.0"
description = "HISPEC Instrument Control Software"
authors = [
    { name="Michael Langmayr", email="langmayr@caltech.edu" },
    { name="Don Neill", email="neill@astro.caltech.edu" },
    { name="Prakriti Gupta", email="pgupta@astro.caltech.edu" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring",
    "pipython",
    "pyserial",
    "libximc>=3.1.4",
    "scipy",
    "pyyaml",
    # SSH transport for the DLI DC3 PDU; the pdu driver imports it
    # without declaring it
    "paramiko",
    # MQTT 5 transport for the FIB PCBs in hispec.driver.fib
    "paho-mqtt>=2",
    # influxdb extra: needed by daemons/generic/keygrabber
    # otel extra: OpenTelemetry export, on once /etc/hispec/otel.env names the backend
    "libby[influxdb,otel]@git+https://github.com/CaltechOpticalObservatories/libby.git@libby-0.2.0",
    "hardware_device_base@git+https://github.com/COO-Utilities/hardware_device_base",
    "instrumentctl@git+https://github.com/CaltechOpticalObservatories/instrumentctl.git",
    "camera_daemon@git+https://github.com/COO-Utilities/camera-daemon.git"
]

[project.optional-dependencies]
# The tracking camera module builds against ImageStreamIO, so only the host
# running the camera installs it: install.sh --extra atcam. The repo is private;
# hosts fetch it with /etc/hispec/deploy-key
atcam = [
    "camera-interface-tracking@git+ssh://git@github.com/CaltechOpticalObservatories/hispec-tracking-camera-instrument.git",
]
# The SHM and FITS viewer; install.sh adds it on feiserver and hispecserver.
# atlas needs Python 3.12, older than hispec's floor
atlas = [
    "atlas@git+https://github.com/CaltechOpticalObservatories/atlas.git ; python_version >= '3.12'",
]
# Plotting and FITS for the engineering scripts under scripts/, which no daemon
# imports: install.sh --extra scripts
scripts = [
    "astropy",
    "matplotlib",
]

[project.scripts]
hispec = "hispec.cli:main"

[tool.pylint.main]
# CI lints without installing the project or its dependencies, and the driver
# packages live in git submodules that the lint job does not check out, so
# these imports can never resolve there. Ignore them rather than reporting
# import-error for environment reasons unrelated to code quality.
ignored-modules = [
    # Third-party dependencies, not installed in the lint environment
    "astropy",
    "camera_daemon",
    "hardware_device_base",
    "instrumentctl",
    "libby",
    "matplotlib",
    "numpy",
    "paho",
    "pysnmp",
    "pytest",
    "PySide6",
    "scipy",
    "serial",
    "zmq",
    # Compiled per instrument from camera-interface, so never on an index
    "camera_interface",
    # Keck/KTL-internal modules, unavailable outside the summit environment
    "DFW",
    "SerialStream",
    # Device drivers vendored as git submodules
    "hispec.driver",
    "PPC102_lib",
]

# The vendor drivers are vendored as submodules so they can be fixed in place,
# but their own dependencies still have to reach the environment. tracking_camera
# and fib are HISPEC's own code with no pyproject, so they are not members.
# gui/ is built with the rest of the ICS, so every host gets the operator GUIs.
[tool.uv.workspace]
members = ["src/hispec/driver/*", "gui"]
exclude = ["src/hispec/driver/tracking_camera", "src/hispec/driver/fib"]

[tool.uv]
# The drivers pin this to v1.0.0, v1.0.1 and unpinned between them, and uv
# allows one URL per package. Without an override nothing resolves at all.
override-dependencies = [
    "hardware_device_base @ git+https://github.com/COO-Utilities/hardware_device_base@v1.0.1",
]
