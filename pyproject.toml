[tool.setuptools.packages.find]
where = ["src"]
include = ["hispec", "hispec.*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hispec"
version = "0.1.0"
description = "HISPEC Instrument Control Software"
authors = [
    { name="Michael Langmayr", email="langmayr@caltech.edu" },
    { name="Don Neill", email="neill@astro.caltech.edu" },
    { name="Prakriti Gupta", email="pgupta@astro.caltech.edu" }
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "keyring",
    "pipython",
    "pyserial",
    "libximc",
    "scipy",
    "pyyaml",
    "libby@git+https://github.com/CaltechOpticalObservatories/libby.git",
    "hardware_device_base@git+https://github.com/COO-Utilities/hardware_device_base"
]

[tool.pylint.main]
# CI lints without installing the project or its dependencies, and the driver
# packages live in git submodules that the lint job does not check out, so
# these imports can never resolve there. Ignore them rather than reporting
# import-error for environment reasons unrelated to code quality.
ignored-modules = [
    # Third-party dependencies, not installed in the lint environment
    "astropy",
    "libby",
    "matplotlib",
    "numpy",
    "pysnmp",
    "pytest",
    "scipy",
    "serial",
    "zmq",
    # Keck/KTL-internal modules, unavailable outside the summit environment
    "DFW",
    "SerialStream",
    # Device drivers vendored as git submodules
    "hispec.driver",
    "PPC102_lib",
]
