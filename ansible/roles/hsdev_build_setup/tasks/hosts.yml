---
# "Update Hosts File": HISPEC private network is 192.168.29.x
- name: Add HISPEC private-network entries to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK - HISPEC private network (192.168.29.x)"
    block: |
      {% for entry in hispec_hosts_entries %}
      {{ '%-16s' | format(entry.ip) }}{{ entry.name }}
      {% endfor %}
  tags: [hosts]
