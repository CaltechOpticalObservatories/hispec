# Example configuration for the Eaton EMAT-08/EMAT-10 PDU daemon
#
# Copy this file into the relevant subsystem's config directory
#
# Usage:
#   daemons/hspower/eaton_pdu -c config/example/pdu.yaml

peer_id: example_pdu
group_id: example

hardware:
  ip_address: 192.168.29.150
  tcp_port: 23
  username: admin
  password: CHANGE_ME  # do not commit real credentials
  outlet_count: 8
  # Optional: name outlets in their keywords (state_arclamp instead of
  # state1). Lowercase letters, digits and underscores; unlisted outlets
  # keep the number.
  # outlet_names:
  #   1: arclamp
  #   2: heater

logging:
  level: INFO
  file: /tmp/example_pdu.log
