# FEI Mask Selector — H C-863 servo + V C-663 stepper, daisy-chained.
#
# Usage:
#   daemons/hsfei/pi-daemon -c config/hsfei/hsfei_ms.yaml

peer_id: ms
group_id: hsfei

hardware:
  ip_address: 192.168.29.100
  tcp_port: 10005

stages:
  - name: v
    device_id: 1
    axis: "1"
    units: mm
    named_positions:
      keck_mask: 33.62
      circ_mask: 61.7
  - name: h
    device_id: 2
    axis: "1"
    units: mm
    named_positions:
      keck_mask: 1.8
      circ_mask: 1.6

logging:
  level: INFO
