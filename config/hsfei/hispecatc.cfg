# camerad configuration for the acquisition and tracking camera on feiserver,
# read in place by hsfei_atcam. Nothing here may live under /home or /tmp,
# which the hispec@ unit hides.
#
ARCHON_IP=10.0.0.2
ARCHON_PORT=4242
DEFAULT_FIRMWARE=/etc/hispec/hispecatc.acf  # placed by hand at install, not in any repo
EXPOSE_PARAM=Expose               # Archon parameter which triggers exposure
ABORT_PARAM=Abort                 # Archon parameter to trigger an abort
EXPTIME_MSEC_PARAM=exptime        # Archon parameter for exposure time in msec
READOUT_TIME=50000                 # Timeout waiting for new frame (ms)
REFPIX_AMP=AM52                   # Amp reading out the reference channel, for REFPXAMP

# Real-time placement needs LimitRTPRIO in the unit, which it does not set yet
#ACQUISITION_THREAD=4,80           # Archon socket reader (camerad:acq)
#PROCESSING_THREAD=4,70            # dispatch to SHM and FITS (camerad:proc)

IMDIR=/opt/hispec/data
BASENAME=image                    # base image filename

# Asynchronous FITS writer (frame_output_factory)
FITS_ENABLED=yes                  # enable FITS writer output {yes|no}
FITS_OUTPUT_DIR=/opt/hispec/data
FITS_AUTODIR=yes                  # write into a YYYYMMDD subdir of FITS_OUTPUT_DIR {yes|no}
FITS_BASENAME=image               # base filename for FITS files

# Shared memory writer, ImageStreamIO (frame_output_factory)
SHM_ENABLED=yes                    # enable shared-memory writer output {yes|no}
SHM_SEGMENT_NAME=hispec_tracking_camera  # ImageStreamIO stream name
SHM_DIR=/dev/shm                   # readers attach with MILK_SHM_DIR=/dev/shm

DIRMODE=0077
TM_ZONE_LOG=local                  # time zone for log entries only, can be "UTC" or "local"
TM_ZONE=UTC                        # time zone for everything else, can be "UTC" or "local"
TZ_ENV=PST8PDT,M3.2.0/2,M11.1.0/2  # TZ ENV variable to use when TM_ZONE_* is "local" (follows POSIX standard)
AUTODIR=no
LONGERROR=true

NBPORT=3030                       # server non-blocking port
BLKPORT=3031                      # server blocking port
ASYNCGROUP=239.1.1.234           # asynchronous broadcast group (or "none")
ASYNCPORT=1234                   # asynchronous message port (if ASYNCGROUP defined)
LOGPATH=/var/log/hispec           # fully qualified path to save log files
LONGEXPOSURE=True                 # exptime arguments are in sec, not msec
