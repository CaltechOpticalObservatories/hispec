# FEI Pickoff Mirror — C-663 stepper instance
#
# Usage:
#   daemons/hsfei/pi-daemon -c config/hsfei/hsfei_feipo.yaml

peer_id: feipo
group_id: hsfei

hardware:
  ip_address: 192.168.29.100
  tcp_port: 10001
  axis: "1"
  units: mm
  timeout_s: 30.0
  retry_count: 3

named_positions:
  J+H: 0.2
  H+JHGap: 32.95
  JHGap: 65.98
  J+JHGap: 98.6

logging:
  level: INFO
