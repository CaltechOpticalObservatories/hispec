# PIAA lens deploy, RED and BLUE in/out, on one Xeryon XD-M-3 controller.
#
# Usage:
#   daemons/hsfei/xeryon -c config/hsfei/hsfei_piaadeploy.yaml

peer_id: piaadeploy
group_id: hsfei

hardware:
  ip_address: 192.168.29.100
  tcp_port: 10011
  settings_file: hispec/driver/xeryon/config/settings_FEI_XD24514_20250902.txt
  position_tolerance: 0.01  # mm

stages:
  - name: red
    suffix: r
    axis: A
    stage: XLS_5_3N
    units: mm
    softmin: -25.0
    softmax: 25.0
  - name: blue
    suffix: b
    axis: B
    stage: XLS_5_3N
    units: mm
    softmin: -25.0
    softmax: 25.0
  # Nothing is wired to axis C, which reports a drifting position
  - name: spare
    axis: C
    stage: XLS_5_3N
    units: mm
    expose: false

logging:
  level: INFO
