#
# Usage:
#   daemons/hsfei/piaa-gimbalmount -c config/hsfei/hsfei_piaagimb.yaml

peer_id: piaagimb
group_id: hsfei

hardware:
  ip_address: 192.168.29.100
  tcp_port: 10013
  axis: 2
  closed_loop_units: mrad
  open_loop_units: volts
  timeout_s: 30.0
  retry_count: 3

limits:
  position:
    soft_min_x: -9.5
    soft_max_x: 9.5
    soft_min_y: -9.5
    soft_max_y: 9.5
  voltage:
    soft_min_volt_x: -20.0
    soft_max_volt_x: 145.0
    soft_min_volt_y: -20.0
    soft_max_volt_y: 145.0

named_positions:
  center: [0.0, 0.0]
  offset1: [1.0, 1.0]
  offset2: [-1.0, -1.0]

logging:
  level: INFO