name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Device drivers live in submodules; without them the wheel is built
          # missing every package under hispec.driver.
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Verify the wheel installs and imports
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install -U pip
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import hispec; print('imported hispec from', hispec.__file__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: hispec-dist-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error
