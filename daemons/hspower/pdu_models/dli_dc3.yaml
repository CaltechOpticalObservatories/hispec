# Digital Loggers DC3 power controller, reached over SSH.
#
# The DC3 switches, names and locks outlets and reports its model and
# firmware, and that is all the driver exposes: no per-outlet metering, no
# auto-restart setting, and neither a manufacturer nor a serial number. No
# capability flag is set, so the daemon registers the outlet basics plus
# model and firmware.
#
# Note that the DC3 driver does not pass a port to paramiko, so a
# deployment's hardware.tcp_port has no effect for this model. The daemon
# still needs hardware.outlet_count, and the driver assumes eight outlets.

# The pdu_drivers adapter that talks to this model.
driver: dli_dc3
