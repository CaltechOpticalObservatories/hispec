# Eaton EMAT-08/10 PDU, reached over Telnet.
#
# One file per PDU model, named by model key (the value used for
# hardware.model in a deployment's config), the same way kpdu has one .def
# file per model. These flags are the HAS_OUTLET_*/HAS_STRIP_* KTL-template
# flags of kroot/util/kpdu/defs/eaton_emat0810.def.
#
# A flag left out defaults to false. The EMAT also reports strip-wide
# current and power (has_strip_amps, has_strip_draw) and a hardware revision
# (has_hardware_ver), all omitted here because the Telnet driver has no
# accessor for them; setting one only logs a startup warning today.

# The pdu_drivers adapter that talks to this model.
driver: eaton_emat

has_outlet_amps: true    # -> outletcurrent{n}
has_outlet_draw: true    # -> outletpower{n}
has_outlet_pos: true     # -> outletautorestart{n}
has_outlet_wh: true      # -> outletenergy{n} and the resetstatistics{n} trigger
has_manufacturer: true   # -> manufacturer
has_serial: true         # -> serial
